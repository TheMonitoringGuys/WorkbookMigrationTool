name: Tests

# This runs the OFFLINE suite: the network is stubbed and the assertions are
# against JSON the tool produced itself. A green check mark here means the logic
# agrees with itself - it does NOT mean the tool works against Azure.
#
# Live verification is tests/Live.Azure.Tests.ps1, which needs a real lab and so
# cannot run here. It skips unless the WBSCOPE_LAB_* variables are set, and prints
# that it did. Same for tests/ArmContract.Tests.ps1, which needs a recorded ARM
# response from tools/Save-ArmFixture.ps1.
#
# Do not report this workflow passing as "verified". That claim, made from a green
# offline suite, is what put a non-working tool in front of a customer.
#
# A local pre-push gate running the same suite is available:
#
#   ./tools/Install-GitHooks.ps1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pester:
    name: Pester
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          $existing = Get-Module -ListAvailable -Name Pester |
              Where-Object { $_.Version -ge [version]'5.0.0' }
          if (-not $existing) {
              Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          (Get-Module -ListAvailable -Name Pester | Sort-Object Version -Descending | Select-Object -First 1).Version

      - name: Run tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-latest
          path: testResults.xml
          if-no-files-found: warn
